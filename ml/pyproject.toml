[project]
name = "provenance-ml"
version = "0.1.0"
description = "Lightweight ML for claim-risk classification, review ranking and entity resolution"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "scikit-learn>=1.5",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
